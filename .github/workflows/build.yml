name: build

# Builds the Breez Recovery desktop app (ui/) and CLI (root) for macOS,
# Windows and Linux. Runs on every pull request, on demand, and on tags
# named v*, which also publish a GitHub release. The Google OAuth desktop
# client is passed in from repository secrets and baked into the binaries.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.25"
  WAILS_VERSION: v2.16.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: breez-recovery-macos
          - os: windows-latest
            platform: windows/amd64
            artifact: breez-recovery-windows
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: breez-recovery-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build desktop app
        working-directory: ui
        env:
          LDFLAGS: >-
            -X main.version=${{ steps.version.outputs.version }}
            -X github.com/breez/breez-mobile-recovery/core.GoogleClientID=${{ secrets.RECOVERY_GOOGLE_CLIENT_ID }}
            -X github.com/breez/breez-mobile-recovery/core.GoogleClientSecret=${{ secrets.RECOVERY_GOOGLE_CLIENT_SECRET }}
        run: |
          tags=""; [[ "${{ runner.os }}" == "Linux" ]] && tags="-tags webkit2_41"
          wails build -platform ${{ matrix.platform }} -skipbindings $tags -ldflags "$LDFLAGS"

      - name: Build CLI
        env:
          LDFLAGS: >-
            -X github.com/breez/breez-mobile-recovery/core.GoogleClientID=${{ secrets.RECOVERY_GOOGLE_CLIENT_ID }}
            -X github.com/breez/breez-mobile-recovery/core.GoogleClientSecret=${{ secrets.RECOVERY_GOOGLE_CLIENT_SECRET }}
        run: |
          ext=""; [[ "${{ runner.os }}" == "Windows" ]] && ext=".exe"
          go build -ldflags "$LDFLAGS" -o "ui/build/bin/recovery-cli$ext" .

      - name: Package
        working-directory: ui/build/bin
        run: |
          ls -la
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            ditto -c -k --keepParent "breez-recovery.app" "../../../${{ matrix.artifact }}.zip"
            zip -j "../../../${{ matrix.artifact }}-cli.zip" recovery-cli
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "../../../${{ matrix.artifact }}.zip" breez-recovery.exe recovery-cli.exe
          else
            tar czf "../../../${{ matrix.artifact }}.tar.gz" breez-recovery recovery-cli
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}-cli.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: Breez Recovery ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Experimental. Desktop app that restores a Breez app backup and moves the funds to a bitcoin address.
            Linux: needs libwebkit2gtk-4.1 and GTK 3 (Ubuntu 22.04 or later, Fedora 37 or later).
            macOS: the app is not notarized yet. After unzipping, right-click the app and choose Open, or run `xattr -dr com.apple.quarantine "Breez Recovery.app"`.
