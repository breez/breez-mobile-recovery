<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Breez Recovery</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7fb; color: #0c1e3c; margin: 0; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  main { max-width: 440px; padding: 40px 48px; text-align: center; background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(12, 30, 60, .08); margin: 16px; }
  .check { width: 44px; height: 44px; border-radius: 50%; background: #e4f6ec; margin: 0 auto 18px; position: relative; }
  .check::after { content: ""; position: absolute; left: 16px; top: 10px; width: 10px; height: 18px; border: solid #1a9c5b; border-width: 0 3px 3px 0; transform: rotate(45deg); }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 8px; }
  p { color: #5b6b85; line-height: 1.5; margin: 0; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f1726; color: #edf2fa; }
    main { background: #17213a; box-shadow: 0 8px 30px rgba(0, 0, 0, .35); }
    p { color: #9aa8c2; }
    .check { background: #12332a; }
  }
</style>
</head>
<body>
<main>
  <div class="check"></div>
  <h1>Signed in</h1>
  <p>You can close this tab and return to Breez Recovery.</p>
</main>
</body>
</html>
